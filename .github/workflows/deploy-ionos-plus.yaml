name: Deploy NavStreet to IONOS Plus

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: navstreet-ionos-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, generate SEO pages, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/875026004917/locations/global/workloadIdentityPools/navstreet-github/providers/navstreet-github-actions
          service_account: navstreet-seo-generator@real-estate-dev-c4a6d.iam.gserviceaccount.com
          project_id: real-estate-dev-c4a6d
          create_credentials_file: true
          export_environment_variables: true

      - name: Generate public listing snapshot (build-time only)
        run: node scripts/generate-public-listing-snapshot.mjs

      - name: Build Angular site
        env:
          CI: 'true'
          SITE_URL: https://navstreet.com
        run: |
          npm run build
          cp .deploy-now/real-estate/.htaccess.template dist/template/browser/.htaccess


      - name: Generate property SEO pages
        run: node scripts/generate-property-pages.mjs

      - name: Generate blog SEO pages
        run: node scripts/generate-blog-pages.mjs

      - name: Configure SSH known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.IONOS_SFTP_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS" || { echo 'Missing IONOS_SFTP_KNOWN_HOSTS secret'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and reconcile generated listing pages on IONOS
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          python3 -m pip install --user paramiko
          python3 scripts/deploy-ionos-sftp.py
