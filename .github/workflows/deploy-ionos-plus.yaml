name: Deploy NavStreet to IONOS Plus

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, generate SEO pages, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build Angular site
        env:
          CI: 'true'
          SITE_URL: https://navstreet.com
        run: |
          npm ci
          npm run build
          cp .deploy-now/real-estate/.htaccess.template dist/template/browser/.htaccess

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/875026004917/locations/global/workloadIdentityPools/navstreet-github/providers/navstreet-github-actions
          service_account: navstreet-seo-generator@real-estate-dev-c4a6d.iam.gserviceaccount.com
          project_id: real-estate-dev-c4a6d
          create_credentials_file: true
          export_environment_variables: true

      - name: Generate property SEO pages
        run: node scripts/generate-property-pages.mjs

      - name: Configure SSH known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.IONOS_SFTP_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS" || { echo 'Missing IONOS_SFTP_KNOWN_HOSTS secret'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload site to IONOS Plus via SFTP
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          python3 -m pip install --user paramiko
          python3 - <<'PY'
          import os
          import pathlib
          import posixpath
          import stat
          import paramiko

          local_root = pathlib.Path('dist/template/browser')
          remote_root = '/public'
          if not (local_root / 'index.html').is_file():
              raise RuntimeError('Angular build output is missing index.html')

          host = os.environ['SFTP_HOST']
          username = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASSWORD']
          if not all((host, username, password)):
              raise RuntimeError('Missing SFTP connection secret')

          client = paramiko.SSHClient()
          client.load_host_keys(os.path.expanduser('~/.ssh/known_hosts'))
          client.set_missing_host_key_policy(paramiko.RejectPolicy())
          client.connect(hostname=host, port=22, username=username,
                         password=password, look_for_keys=False, allow_agent=False,
                         timeout=30)
          try:
              sftp = client.open_sftp()
              try:
                  sftp.stat(remote_root)
              except FileNotFoundError:
                  raise RuntimeError('Expected IONOS /public directory is missing')

              created = {remote_root}
              count = 0
              for path in sorted(local_root.rglob('*')):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(local_root).as_posix()
                  remote_path = posixpath.join(remote_root, relative)
                  parent = posixpath.dirname(remote_path)
                  pending = []
                  while parent not in created and parent != '/':
                      pending.append(parent)
                      parent = posixpath.dirname(parent)
                  for directory in reversed(pending):
                      try:
                          sftp.mkdir(directory)
                      except OSError:
                          if not stat.S_ISDIR(sftp.stat(directory).st_mode):
                              raise
                      created.add(directory)
                  sftp.put(str(path), remote_path)
                  count += 1
              print(f'Uploaded {count} files to {remote_root}')
              print('Existing remote files were not deleted (safe initial migration).')
          finally:
              client.close()
          PY
