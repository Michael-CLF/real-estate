# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: dist/template/browser

jobs:
# Please do not rename this job
  build-project:
    name: build real-estate
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x

      - name: Build Node assets
        env:
          CI: true
          SITE_URL: ${{ inputs.site-url }}
        run: |
          npm ci
          npm run build

                - name: Add Angular SPA routing
        run: |
          cp .deploy-now/real-estate/.htaccess.template "${DEPLOYMENT_FOLDER}/.htaccess"
          test -f "${DEPLOYMENT_FOLDER}/.htaccess"
          ls -la "${DEPLOYMENT_FOLDER}/.htaccess"

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 9ba90a28-823a-4778-b1cd-e95dd538b9e5
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/real-estate/config.yaml
          action: upload
