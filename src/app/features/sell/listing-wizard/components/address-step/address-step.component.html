<section class="wizard-step">

    <h2>Property Address</h2>

    <p>
        Enter the address of the property you want to sell.
    </p>

    <form [formGroup]="form">

        <div class="field">

            <label>Street Address</label>

            <input type="text" formControlName="addressLine1">

        </div>

        <div class="field">

            <label>Address Line 2</label>

            <input type="text" formControlName="addressLine2">

        </div>

        <div class="three-column">

            <div class="field">

                <label>City</label>

                <input type="text" formControlName="city">

            </div>

            <div class="field">

                <label>State</label>

                <select formControlName="state">

                    @for (state of states; track state.code) {

                    <option [value]="state.code">
                        {{ state.name }}
                    </option>

                    }

                </select>

            </div>

            <div class="field">

                <label>ZIP Code</label>

                <input type="text" formControlName="zipCode" maxlength="5" (blur)="lookupZipCode()">

            </div>

            <div class="field">

                <label>County</label>

                <input type="text" formControlName="county" readonly>

            </div>

        </div>

    </form>

</section>
