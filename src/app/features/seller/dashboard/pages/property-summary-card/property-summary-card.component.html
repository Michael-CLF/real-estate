<article class="property-summary-card">
  <div class="property-summary-card__visual" aria-hidden="true">
    <div class="property-summary-card__visual-icon">
      <svg viewBox="0 0 24 24">
        <path
          d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Zm2 0v8h2v-6h10v6h2v-8l-7-6.2L5 11Z"
        />
      </svg>
    </div>

    <span class="property-summary-card__visual-label">
      Seller Listing
    </span>
  </div>

  <div class="property-summary-card__content">
    <div class="property-summary-card__header">
      <div>

        <h2 class="property-summary-card__title">
          {{ property.addressLine1 }}
        </h2>

        <p class="property-summary-card__location">
          {{ property.city }}, {{ property.state }} {{ property.zipCode }}
        </p>
      </div>

      <span class="property-summary-card__status">
        {{ property.status }}
      </span>
    </div>

    <div class="property-summary-card__stats">
      <div class="property-summary-card__stat">
        <span class="property-summary-card__stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2v2.1c-2.3.4-4 2-4 4.1 0 2.6 2.2 3.5 4.1 4.1 1.8.6 2.9 1 2.9 2.2 0 1.1-1.1 1.9-2.7 1.9-1.8 0-3.2-.8-4.2-1.8L6.6 16c1.2 1.3 3 2.2 5.4 2.5V21h2v-2.6c2.4-.5 4-2.1 4-4.2 0-2.7-2.3-3.6-4.4-4.3-1.7-.5-2.6-.9-2.6-1.9 0-1 .9-1.7 2.4-1.7 1.4 0 2.7.6 3.7 1.4l1.3-1.6A8.4 8.4 0 0 0 14 4.1V2h-2Z"
            />
          </svg>
        </span>

        <div>
          <span class="property-summary-card__stat-label">
            List price
          </span>

          <strong class="property-summary-card__price">
            {{ property.listPrice | currency:'USD':'symbol':'1.0-0' }}
          </strong>
        </div>
      </div>

      <div class="property-summary-card__stat">
        <span class="property-summary-card__stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V2Zm13 8H4v10h16V10Zm-2-4H6v2h12V6Z"
            />
          </svg>
        </span>

        <div>
          <span class="property-summary-card__stat-label">
            Days on market
          </span>

          <strong class="property-summary-card__stat-value">
            {{ property.daysOnMarket }}
          </strong>
        </div>
      </div>
    </div>

    <div class="property-summary-card__actions">
      <a
        class="property-summary-card__link"
        routerLink="/marketplace"
      >
        

        <span>View public listing</span>
      </a>
    </div>
  </div>
</article>
