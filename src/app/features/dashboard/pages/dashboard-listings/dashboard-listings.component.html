<section
  class="dashboard-listings"
  aria-labelledby="dashboard-listings-title"
>
  <header class="dashboard-listings__header">
    <div>
      <p class="dashboard-listings__eyebrow">
        Property management
      </p>

      <h1 id="dashboard-listings-title">
        My Listings
      </h1>

      <p class="dashboard-listings__introduction">
        Manage your draft, active, under-contract
        and sold property listings.
      </p>
    </div>

    <a
      class="dashboard-listings__new-listing"
      routerLink="/sell/new"
    >
      <i
        class="fa-solid fa-plus"
        aria-hidden="true"
      ></i>

      New Listing
    </a>
  </header>

  <section
    class="dashboard-listings__summary"
    aria-label="Listing totals"
  >
    <button
      class="dashboard-listings__summary-card"
      type="button"
      [class.dashboard-listings__summary-card--active]="
        selectedTab() === 'draft'
      "
      (click)="selectTab('draft')"
    >
      <span
        class="
          dashboard-listings__summary-icon
          dashboard-listings__summary-icon--draft
        "
      >
        <i
          class="fa-solid fa-file-pen"
          aria-hidden="true"
        ></i>
      </span>

      <span>
        <small>Draft</small>
        <strong>
          {{ draftListings().length }}
        </strong>
      </span>
    </button>

    <button
      class="dashboard-listings__summary-card"
      type="button"
      [class.dashboard-listings__summary-card--active]="
        selectedTab() === 'active'
      "
      (click)="selectTab('active')"
    >
      <span
        class="
          dashboard-listings__summary-icon
          dashboard-listings__summary-icon--active
        "
      >
        <i
          class="fa-solid fa-house-circle-check"
          aria-hidden="true"
        ></i>
      </span>

      <span>
        <small>Active</small>
        <strong>
          {{ activeListings().length }}
        </strong>
      </span>
    </button>

    <button
      class="dashboard-listings__summary-card"
      type="button"
      [class.dashboard-listings__summary-card--active]="
        selectedTab() === 'under-contract'
      "
      (click)="selectTab('under-contract')"
    >
      <span
        class="
          dashboard-listings__summary-icon
          dashboard-listings__summary-icon--contract
        "
      >
        <i
          class="fa-solid fa-file-signature"
          aria-hidden="true"
        ></i>
      </span>

      <span>
        <small>Under Contract</small>
        <strong>
          {{
            underContractListings().length
          }}
        </strong>
      </span>
    </button>

    <button
      class="dashboard-listings__summary-card"
      type="button"
      [class.dashboard-listings__summary-card--active]="
        selectedTab() === 'sold'
      "
      (click)="selectTab('sold')"
    >
      <span
        class="
          dashboard-listings__summary-icon
          dashboard-listings__summary-icon--sold
        "
      >
        <i
          class="fa-solid fa-key"
          aria-hidden="true"
        ></i>
      </span>

      <span>
        <small>Sold</small>
        <strong>
          {{ soldListings().length }}
        </strong>
      </span>
    </button>
  </section>

  <section class="dashboard-listings__panel">
    <nav
      class="dashboard-listings__tabs"
      aria-label="Filter listings by status"
    >
      <button
        type="button"
        [class.dashboard-listings__tab--active]="
          selectedTab() === 'draft'
        "
        (click)="selectTab('draft')"
      >
        Draft

        <span>
          {{ draftListings().length }}
        </span>
      </button>

      <button
        type="button"
        [class.dashboard-listings__tab--active]="
          selectedTab() === 'active'
        "
        (click)="selectTab('active')"
      >
        Active

        <span>
          {{ activeListings().length }}
        </span>
      </button>

      <button
        type="button"
        [class.dashboard-listings__tab--active]="
          selectedTab() === 'under-contract'
        "
        (click)="selectTab('under-contract')"
      >
        Under Contract

        <span>
          {{
            underContractListings().length
          }}
        </span>
      </button>

      <button
        type="button"
        [class.dashboard-listings__tab--active]="
          selectedTab() === 'sold'
        "
        (click)="selectTab('sold')"
      >
        Sold

        <span>
          {{ soldListings().length }}
        </span>
      </button>
    </nav>

    <div class="dashboard-listings__content">
      @if (isLoading()) {
        <div
          class="dashboard-listings__loading"
          role="status"
          aria-live="polite"
        >
          <span
            class="dashboard-listings__spinner"
            aria-hidden="true"
          ></span>

          <div>
            <strong>
              Loading your listings
            </strong>

            <p>
              Your property information is being
              retrieved.
            </p>
          </div>
        </div>
      } @else if (loadError()) {
        <div
          class="dashboard-listings__error"
          role="alert"
        >
          <span aria-hidden="true">
            <i
              class="fa-solid fa-circle-exclamation"
            ></i>
          </span>

          <div>
            <strong>
              Listings unavailable
            </strong>

            <p>
              {{ loadError() }}
            </p>

            <button
              type="button"
              (click)="retryLoading()"
            >
              Try Again
            </button>
          </div>
        </div>
      } @else {
        <app-account-listings
          [listings]="selectedListings()"
          [emptyMessage]="
            selectedEmptyMessage()
          "
          [actionLabel]="
            selectedActionLabel()
          "
          (actionSelected)="
            manageListing($event)
          "
        />
      }
    </div>
  </section>
</section>
