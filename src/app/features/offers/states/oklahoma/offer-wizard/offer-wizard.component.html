@if (terms(); as currentTerms) {
  <section class="oklahoma-offer-wizard">
    @if (contractDefinition(); as contract) {
      <aside class="oklahoma-offer-wizard__contract">
        <span>Selected Oklahoma contract</span>
        <strong>{{ contract.formName }}</strong>
        <small>
          OREC official form · Effective {{ contract.effectiveDate }}
        </small>
      </aside>
    }

    <app-offer-wizard-shell
      stateName="Oklahoma"
      title="Oklahoma purchase offer"
      description="Complete the questions for the selected Oklahoma contract. Your draft will be saved through NavStreet's offer service."
      [sections]="sections()"
      [terms]="currentTerms"
      [buyers]="draftBuyers()"
      [sellers]="sellers()"
      [listingDisclosures]="listingDisclosures()"
      [validationIssues]="validationIssues()"
      [saving]="saving()"
      [submitting]="submitting()"
      submitLabel="Review and submit offer"
      (fieldValueChange)="onFieldValueChange($event)"
      (coBuyerChange)="onCoBuyerChanged($event)"
      (sectionChanged)="onSectionChanged()"
      (documentSelected)="documentSelected.emit($event)"
      (submitRequested)="onSubmitRequested()"
      (returnToListingRequested)="returnToListingRequested.emit()"
      (listingDisclosureRequested)="listingDisclosureRequested.emit($event)"
    />
  </section>
} @else {
  <section class="oklahoma-offer-wizard__loading" aria-live="polite">
    Preparing the Oklahoma residential sale contract from the property listing…
  </section>
}
